version: '3.8'
services:
  mssql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=gRdpW6eEFqNG
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - mssql_log:/var/opt/mssql/log
      - mssql_secrets:/var/opt/mssql/secrets
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g

  mongo-db:
    image: mongo:4.4
    environment:
      - MONGO_INITDB_ROOT_USERNAME=sa
      - MONGO_INITDB_ROOT_PASSWORD=gRdpW6eEFqNG
    ports:
      - 27017:27017
    user:
      "999:999"
    volumes:
      - mongodb_data:/data/db

volumes:
  mssql_data:
  mssql_log:
  mssql_secrets:
  mongodb_data: